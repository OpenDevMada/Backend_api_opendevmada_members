<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Test CORS Final</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
      }
      .result {
        margin: 10px 0;
        padding: 10px;
        border-radius: 5px;
      }
      .success {
        background: #d4edda;
        color: #155724;
      }
      .error {
        background: #f8d7da;
        color: #721c24;
      }
      .info {
        background: #d1ecf1;
        color: #0c5460;
      }
      pre {
        background: #f8f9fa;
        padding: 10px;
        overflow-x: auto;
      }
    </style>
  </head>
  <body>
    <h1>🔬 Test CORS Final - InfinityFree</h1>

    <div id="results"></div>

    <button onclick="testAPIFunction()">🚀 Test API Complet</button>

    <script>
      const API_URL =
        "https://opendevmadaannuaire.infinityfree.me/api/opendevmada/membres";

      async function testAPIFunction() {
        const resultsDiv = document.getElementById("results");
        resultsDiv.innerHTML = '<div class="info">🔄 Tests en cours...</div>';

        let results = [];

        // Test 1: Fetch basique
        try {
          const response = await fetch(API_URL);
          const data = await response.text();

          if (data.startsWith("{")) {
            results.push({
              test: "Fetch Direct",
              status: "success",
              message: "✅ API retourne du JSON valide",
              details: `Status: ${
                response.status
              }, Content-Type: ${response.headers.get("content-type")}`,
            });
          } else {
            results.push({
              test: "Fetch Direct",
              status: "error",
              message: "❌ API retourne du HTML",
              details: data.substring(0, 200),
            });
          }
        } catch (error) {
          results.push({
            test: "Fetch Direct",
            status: "error",
            message: `❌ Erreur: ${error.message}`,
            details: error.toString(),
          });
        }

        // Test 2: Headers CORS
        try {
          const response = await fetch(API_URL);
          const corsHeaders = {
            "Access-Control-Allow-Origin": response.headers.get(
              "Access-Control-Allow-Origin"
            ),
            "Access-Control-Allow-Methods": response.headers.get(
              "Access-Control-Allow-Methods"
            ),
            "Access-Control-Allow-Headers": response.headers.get(
              "Access-Control-Allow-Headers"
            ),
          };

          const hasCORS = corsHeaders["Access-Control-Allow-Origin"] !== null;

          results.push({
            test: "Headers CORS",
            status: hasCORS ? "success" : "error",
            message: hasCORS
              ? "✅ Headers CORS présents"
              : "❌ Headers CORS manquants",
            details: JSON.stringify(corsHeaders, null, 2),
          });
        } catch (error) {
          results.push({
            test: "Headers CORS",
            status: "error",
            message: `❌ Impossible de vérifier CORS: ${error.message}`,
            details: "",
          });
        }

        // Test 3: Méthodes HTTP
        const methods = ["GET", "POST", "OPTIONS"];
        for (const method of methods) {
          try {
            const response = await fetch(API_URL, { method });
            results.push({
              test: `Méthode ${method}`,
              status: response.ok ? "success" : "error",
              message: `${response.ok ? "✅" : "❌"} ${method}: ${
                response.status
              } ${response.statusText}`,
              details: `Headers: ${JSON.stringify(
                Object.fromEntries(response.headers.entries()),
                null,
                2
              )}`,
            });
          } catch (error) {
            results.push({
              test: `Méthode ${method}`,
              status: "error",
              message: `❌ ${method}: ${error.message}`,
              details: error.toString(),
            });
          }
        }

        // Affichage des résultats
        let html = "<h2>📊 Résultats des Tests</h2>";
        results.forEach((result) => {
          html += `
                    <div class="result ${result.status}">
                        <h3>${result.test}</h3>
                        <p>${result.message}</p>
                        ${
                          result.details
                            ? `<details><summary>Détails</summary><pre>${result.details}</pre></details>`
                            : ""
                        }
                    </div>
                `;
        });

        // Recommandations
        const corsOK = results.some(
          (r) => r.test === "Headers CORS" && r.status === "success"
        );
        const apiOK = results.some(
          (r) => r.test === "Fetch Direct" && r.status === "success"
        );

        html += "<h2>🎯 Recommandations</h2>";
        if (apiOK && corsOK) {
          html +=
            '<div class="result success"><p>✅ Votre API est parfaitement configurée ! Le problème vient probablement du serveur de développement. Essayez de servir votre frontend depuis un autre port.</p></div>';
        } else if (apiOK && !corsOK) {
          html +=
            '<div class="result error"><p>❌ API fonctionne mais CORS manquant. Vérifiez que routes/api.php est bien appelé par index.php</p></div>';
        } else {
          html +=
            '<div class="result error"><p>❌ Problème de configuration serveur. Vérifiez le déploiement sur InfinityFree.</p></div>';
        }

        resultsDiv.innerHTML = html;
      }

      // Auto-test au chargement
      window.onload = testAPIFunction;
    </script>
  </body>
</html>
